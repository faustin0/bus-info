pull_request_rules:
  - name: Automatic merge of scala-steward PRs
    conditions:
      - head~=^update/
      - check-success=build-test-package
    actions:
      queue:
        method: rebase
        name: default

  - name: automatic merge of dependabot 🤖
    conditions:
      - author~=^dependabot(|-preview)\[bot\]$
      - check-success=build-test-package
      - base=master
    actions:
      queue:
        method: rebase
        name: default

queue_rules:
  - name: default
    merge_conditions:
      # Conditions to get out of the queue (= merged)
      - check-success=build-test-package
